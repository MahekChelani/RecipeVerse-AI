services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recipeverse-backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      FRONTEND_URL: http://localhost:8080
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: recipeverse-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
